name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - id: meta
      run: |
        TAG="${{ github.event.inputs.tag || github.ref_name }}"
        case "$TAG" in
          v*) ;;
          *) echo "::error::tag must start with v, got '$TAG'"; exit 1;;
        esac
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    name: linux x86_64
    needs: meta
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libgl1-mesa-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBLACKHOLEGL_VERSION="${{ needs.meta.outputs.version }}"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      run: |
        cmake --install build --config Release --prefix staging
        mkdir -p package
        cp staging/bin/blackholegl package/
        cp -r staging/share/blackholegl/shaders package/shaders
        cp README.md LICENSE package/
        tar -czf blackholegl-linux-x86_64.tar.gz -C package .
        rm -rf staging package

    - uses: actions/upload-artifact@v4
      with:
        name: blackholegl-linux-x86_64
        path: blackholegl-linux-x86_64.tar.gz

  windows:
    name: windows x64
    needs: meta
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # no -G, the runner image ships whatever Visual Studio is current and
      # CMake picks it as the default generator
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBLACKHOLEGL_VERSION="${{ needs.meta.outputs.version }}"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix staging
        New-Item -ItemType Directory -Path package -Force | Out-Null
        Copy-Item staging/bin/blackholegl.exe package/
        Copy-Item -Recurse staging/share/blackholegl/shaders package/shaders
        Copy-Item README.md LICENSE package/
        Compress-Archive -Path package/* -DestinationPath blackholegl-windows-x64.zip
        Remove-Item -Recurse -Force staging, package

    - uses: actions/upload-artifact@v4
      with:
        name: blackholegl-windows-x64
        path: blackholegl-windows-x64.zip

  release:
    name: github release
    needs: [meta, linux, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Checksums
      run: sha256sum artifacts/*/*.tar.gz artifacts/*/*.zip > blackholegl-checksums.txt

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.meta.outputs.tag }}
      run: |
        FILES=(artifacts/*/*.tar.gz artifacts/*/*.zip blackholegl-checksums.txt)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "${FILES[@]}" --clobber
        else
          gh release create "$TAG" "${FILES[@]}" \
            --title "blackholegl $TAG" \
            --generate-notes
        fi
